<!DOCTYPE html>
<html lang="en">

<head>
    <!-- THIS GOES FIRST -->
    <script>
        (function () {
            var saved = localStorage.getItem('currrentTheme');
            var isDark = saved === 'dark-theme'
                || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark-theme');
                document.body.classList.add('dark-theme');
            }
        })();
    </script>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../admin.css">
    <link rel="stylesheet" href="./chat.css">
    <style>
        /* Anti-FOUC: applied instantly before external CSS loads */
        html { background: #f0eff5; }
        html.dark-theme { background: #0d242c; }
        @media (min-width: 1024px) {
            body { display: grid; grid-template-columns: 17rem auto; }
        }
    </style>
</head>

<body>

    <!--==================== NAVBAR ====================-->
    <nav>
        <div class="container nav_container">
            <button class="nav_menu-btn nav_menu-btn--mobile"><i class="uil uil-bars"></i></button>
            <a href="../" class="nav_logo">
                <img src="../../assets/logo.png" alt="Logo">
            </a>
            <div class="nav_search">
                <i class="uil uil-search"></i>
                <input type="search" id="adminSearch" placeholder="Search users, transactions…">
            </div>
            <div class="nav_profile-wrapper">
                <div class="nav_bell-wrap" id="navBellWrap">
                    <button class="nav_bell-btn" id="navBellBtn" onclick="toggleNotifDropdown(event)" aria-label="Notifications">
                        <i class="uil uil-bell"></i>
                        <span class="nav_bell-badge" id="navBellBadge" style="display:none;">0</span>
                    </button>
                    <div class="notif-dropdown" id="notifDropdown">
                        <div class="notif-dropdown-header">
                            <span>Notifications</span>
                            <button class="notif-mark-read" onclick="markAllRead()">Mark all read</button>
                        </div>
                        <div class="notif-dropdown-list" id="notifDropdownList">
                            <div class="notif-loading"><i class="uil uil-spinner-alt spin"></i></div>
                        </div>
                        <a class="notif-see-all" href="../../admin/notifications/">See all notifications</a>
                    </div>
                </div>
                <div class="nav_profile">
                    <div class="nav_profile-photo">
                        <img src="../../assets/profile-1.jpg" alt="Admin">
                    </div>
                    <h5 id="navName">Admin</h5>
                    <span class="admin-badge">Admin</span>
                </div>
                <button class="nav_menu-btn nav_menu-btn--desktop"><i class="uil uil-bars"></i></button>
            </div>
        </div>
    </nav>

    <!--==================== SIDEBAR ====================-->
    <menu class="sidebar">
        <a href="../">
            <i class="uil uil-create-dashboard"></i><h5>Overview</h5>
        </a>
        <a href="../user/">
            <i class="uil uil-users-alt"></i><h5>Users</h5>
        </a>
        <a href="../deposit/">
            <i class="uil uil-arrow-circle-down"></i><h5>Deposits</h5>
        </a>
        <a href="../withdrawals/">
            <i class="uil uil-arrow-circle-up"></i><h5>Withdrawals</h5>
        </a>
        <a href="../investments/">
            <i class="uil uil-diamond"></i>
            <h5>Investments</h5>
        </a>
        <a href="../kyc/">
            <i class="uil uil-shield-check"></i>
            <h5>KYC</h5>
        </a>
        <a href="../settings/">
            <i class="uil uil-setting"></i>
            <h5>Settings</h5>
        </a>
        <a href="./" class="active">
            <i class="uil uil-comments-alt"></i><h5>Messages</h5>
        </a>
        <div class="sidebar-divider"></div>
        <a href="../../dashboard/" class="sidebar-user-link">
            <i class="uil uil-exit"></i><h5>User View</h5>
        </a>
        <button class="sidebar_close-btn"><i class="uil uil-multiply"></i></button>
        <button class="sidebar_logout-btn" onclick="logout()">
            <i class="uil uil-sign-out-alt"></i><h5>Logout</h5>
        </button>
    </menu>

    <!--==================== CHAT LAYOUT ====================-->
    <main class="admin-main chat-layout">

        <!-- Left: conversation list -->
        <aside class="chat-sidebar">
            <div class="chat-sidebar-header">
                <h2>Conversations</h2>
                <span class="unread-total" id="unreadTotal"></span>
            </div>

            <!-- Loading -->
            <div id="convoLoading" class="admin-loading">
                <div class="admin-skeleton"></div>
                <div class="admin-skeleton"></div>
                <div class="admin-skeleton"></div>
            </div>

            <!-- Empty -->
            <div class="admin-empty" id="convoEmpty" style="display:none;">
                <i class="uil uil-comment-slash"></i>
                <p>No conversations yet.</p>
            </div>

            <!-- List -->
            <ul class="convo-list" id="convoList" style="display:none;"></ul>
        </aside>

        <!-- Right: message thread -->
        <section class="chat-thread" id="chatThread">

            <!-- Placeholder when no convo selected -->
            <div class="chat-placeholder" id="chatPlaceholder">
                <i class="uil uil-comments-alt"></i>
                <h3>Select a conversation</h3>
                <p>Choose a user from the list to view and reply to their messages.</p>
            </div>

            <!-- Active thread (hidden until convo selected) -->
            <div class="chat-thread-inner" id="chatThreadInner" style="display:none;">

                <!-- Thread header -->
                <div class="chat-thread-header">
                    <div class="chat-thread-user">
                        <div class="admin-item-avatar" id="threadAvatar">?</div>
                        <div>
                            <h3 id="threadName">—</h3>
                            <p id="threadEmail">—</p>
                        </div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="chat-messages" id="chatMessages">
                    <!-- Populated by JS -->
                </div>

                <!-- File preview bar — visible only when a file is staged -->
                <div class="chat-file-preview" id="chatFilePreview" style="display:none;">
                    <div class="chat-file-preview-inner">
                        <i class="uil uil-file-alt chat-file-icon" id="chatFileIcon"></i>
                        <span class="chat-file-name" id="chatFileName"></span>
                    </div>
                    <button class="chat-file-remove" onclick="removeFile()" title="Remove file">
                        <i class="uil uil-times"></i>
                    </button>
                </div>

                <!-- Reply box -->
                <div class="chat-reply-box">
                    <input
                        type="file"
                        id="chatFileInput"
                        accept="image/jpeg,image/png,image/gif,image/webp,application/pdf"
                        style="display:none;"
                        onchange="stageFile(this)">

                    <button class="chat-attach-btn" onclick="document.getElementById('chatFileInput').click()" title="Attach image or PDF">
                        <i class="uil uil-paperclip"></i>
                    </button>

                    <textarea
                        id="replyInput"
                        class="chat-reply-input"
                        placeholder="Type your reply…"
                        rows="2"
                        onkeydown="handleReplyKey(event)">
                    </textarea>
                    <button class="chat-send-btn" id="chatSendBtn" onclick="sendReply()">
                        <i class="uil uil-message"></i>
                    </button>
                </div>

            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase.js"></script>
    <script src="../../auth.js"></script>
    <script src="../../main.js"></script>
    <script src="../admin.js"></script>
    <script src="./chat.js"></script>
    <script src="../../notify-inapp.js"></script>
</body>
</html>
