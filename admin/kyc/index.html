<!DOCTYPE html>
<html lang="en">

<head>
    <!-- THIS GOES FIRST -->
    <script>
        (function () {
            const theme = localStorage.getItem('currrentTheme');
            if (theme) document.documentElement.classList.add(theme);
        })();
    </script>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Verification</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../admin.css">
</head>

<body>

    <!--==================== NAVBAR ====================-->
    <nav>
        <div class="container nav_container">
            <a href="../" class="nav_logo">
                <img src="../../assets/logo.png" alt="Logo">
            </a>
            <div class="nav_search">
                <i class="uil uil-search"></i>
                <input type="search" id="adminSearch" placeholder="Search by name or email…">
            </div>
            <div class="nav_profile-wrapper">
                <button class="nav_theme-btn">
                    <i class="uil uil-moon"></i>
                </button>
                <div class="nav_profile">
                    <div class="nav_profile-photo">
                        <img src="../../assets/profile-1.jpg" alt="Admin">
                    </div>
                    <h5 id="navName">Admin</h5>
                    <span class="admin-badge">Admin</span>
                </div>
                <button class="nav_menu-btn">
                    <i class="uil uil-bars"></i>
                </button>
            </div>
        </div>
    </nav>


    <!--==================== SIDEBAR ====================-->
    <menu class="sidebar">
        <a href="../">
            <i class="uil uil-create-dashboard"></i>
            <h5>Overview</h5>
        </a>
        <a href="../user/">
            <i class="uil uil-users-alt"></i>
            <h5>Users</h5>
        </a>
        <a href="../deposit/">
            <i class="uil uil-arrow-circle-down"></i>
            <h5>Deposits</h5>
        </a>
        <a href="../withdrawals/">
            <i class="uil uil-arrow-circle-up"></i>
            <h5>Withdrawals</h5>
        </a>
        <a href="../investments/">
            <i class="uil uil-diamond"></i>
            <h5>Investments</h5>
        </a>
        <a href="./" class="active">
            <i class="uil uil-shield-check"></i>
            <h5>KYC</h5>
        </a>
        <a href="../settings/">
            <i class="uil uil-setting"></i>
            <h5>Settings</h5>
        </a>
        <a href="../chat/">
            <i class="uil uil-comments-alt"></i>
            <h5>Messages</h5>
        </a>
        <div class="sidebar-divider"></div>
        <a href="../../dashboard/" class="sidebar-user-link">
            <i class="uil uil-exit"></i>
            <h5>User View</h5>
        </a>
        <button class="sidebar_close-btn">
            <i class="uil uil-multiply"></i>
        </button>
        <button class="sidebar_logout-btn" onclick="logout()">
            <i class="uil uil-sign-out-alt"></i>
            <h5>Logout</h5>
        </button>
    </menu>


    <!--==================== MAIN ====================-->
    <main class="admin-main">

        <header class="admin-header">
            <div>
                <h1>KYC Verification</h1>
                <p class="admin-subtitle">Review identity documents and verify or reject user accounts.</p>
            </div>
            <button class="refresh-btn" id="refreshBtn" onclick="loadKyc()">
                <i class="uil uil-refresh"></i> Refresh
            </button>
        </header>


        <!-- Filter bar -->
        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-status="pending">Pending</button>
                <button class="filter-tab" data-status="verified">Verified</button>
                <button class="filter-tab" data-status="rejected">Rejected</button>
                <button class="filter-tab" data-status="unsubmitted">Unsubmitted</button>
                <button class="filter-tab" data-status="all">All</button>
            </div>
            <div class="search-wrap">
                <i class="uil uil-search"></i>
                <input type="search" id="kycSearch" placeholder="Name or email…">
            </div>
        </div>


                <!-- Card list -->
        <div class="admin-list-wrap">
            <div id="kycLoading" class="admin-loading">
                <i class="uil uil-spinner-alt spin"></i> Loading…
            </div>
            <div id="kycEmpty" class="admin-empty" style="display:none;">
                <i class="uil uil-inbox"></i>
                <p>No users found.</p>
            </div>
            <div id="kycList" class="admin-card-list" style="display:none;"></div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase.js"></script>
    <script src="../../auth.js"></script>
    <script src="../../main.js"></script>
    <script src="../admin.js"></script>
    <script src="../../notify.js"></script>
    <script src="./kyc.js"></script>
</body>

</html>
