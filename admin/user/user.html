<!DOCTYPE html>
<html lang="en">

<head>
    <!-- THIS GOES FIRST -->
    <script>
        (function () {
            const theme = localStorage.getItem('currrentTheme');
            if (theme) document.documentElement.classList.add(theme);
        })();
    </script>
    <link rel="stylesheet" href="...">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management — SyncProfitPath Admin</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../admin.css">
</head>

<body>

    <!--==================== NAVBAR ====================-->
    <nav>
        <div class="container nav_container">
            <a href="../index.html" class="nav_logo">
                <img src="../../assets/logo.png" alt="Logo">
            </a>
            <div class="nav_search">
                <i class="uil uil-search"></i>
                <input type="search" id="userSearch" placeholder="Search by name, email, country…" oninput="filterUsers()">
            </div>
            <div class="nav_profile-wrapper">
                <button class="nav_theme-btn"><i class="uil uil-moon"></i></button>
                <div class="nav_profile">
                    <div class="nav_profile-photo">
                        <img src="../../assets/profile-1.jpg" alt="Admin">
                    </div>
                    <h5 id="navName">Admin</h5>
                    <span class="admin-badge">Admin</span>
                </div>
                <button class="nav_menu-btn"><i class="uil uil-bars"></i></button>
            </div>
        </div>
    </nav>

    <!--==================== SIDEBAR ====================-->
    <menu class="sidebar">
        <a href="../index.html">
            <i class="uil uil-create-dashboard"></i>
            <h5>Overview</h5>
        </a>
        <a href="./users.html" class="active">
            <i class="uil uil-users-alt"></i>
            <h5>Users</h5>
        </a>
        <a href="../deposit/deposit.html">
            <i class="uil uil-arrow-circle-down"></i>
            <h5>Deposits</h5>
        </a>
        <a href="../withdrawals/withdrawals.html">
            <i class="uil uil-arrow-circle-up"></i>
            <h5>Withdrawals</h5>
        </a>
        <a href="../investments/investments.html">
            <i class="uil uil-diamond"></i>
            <h5>Investments</h5>
        </a>
        <a href="../kyc/kyc.html">
            <i class="uil uil-shield-check"></i>
            <h5>KYC</h5>
        </a>
        <a href="../plans/plans.html">
            <i class="uil uil-layer-group"></i>
            <h5>Plans</h5>
        </a>
        <a href="../chat/chat.html">
            <i class="uil uil-comments-alt"></i>
            <h5>Messages</h5>
        </a>
        <div class="sidebar-divider"></div>
        <a href="../../index.html" class="sidebar-user-link">
            <i class="uil uil-exit"></i>
            <h5>User View</h5>
        </a>
        <button class="sidebar_close-btn"><i class="uil uil-multiply"></i></button>
        <button class="sidebar_logout-btn" onclick="logout()">
            <i class="uil uil-sign-out-alt"></i><h5>Logout</h5>
        </button>
    </menu>

    <!--==================== MAIN ====================-->
    <main class="admin-main">

        <header class="admin-header">
            <div>
                <h1>User Management</h1>
                <p class="admin-subtitle">Manage all registered users</p>
            </div>
            <div class="admin-header-actions">
                <span class="admin-count-label">Total: <strong id="userCountLabel">—</strong></span>
            </div>
        </header>

        <!-- Filter tabs -->
        <div class="admin-filter-tabs">
            <button class="admin-filter-tab active" data-filter="all" onclick="setFilter('all', this)">All Users</button>
            <button class="admin-filter-tab" data-filter="verified" onclick="setFilter('verified', this)">Verified</button>
            <button class="admin-filter-tab" data-filter="unsubmitted" onclick="setFilter('unsubmitted', this)">Unverified</button>
            <button class="admin-filter-tab" data-filter="pending" onclick="setFilter('pending', this)">KYC Pending</button>
        </div>

        <!-- Loading -->
        <div class="admin-loading" id="usersLoading">
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
        </div>

        <!-- Empty -->
        <div class="admin-empty" id="usersEmpty" style="display:none;">
            <i class="uil uil-users-alt"></i>
            <p>No users found.</p>
        </div>

        <!-- Table -->
        <div class="admin-table-wrapper" id="usersTableWrapper" style="display:none;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Country</th>
                        <th>Balance</th>
                        <th>KYC</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>

    </main>

    <!-- ==================== USER DETAIL MODAL ==================== -->
    <div class="admin-modal-overlay" id="userModalOverlay" onclick="closeUserModal(event)">
        <div class="admin-modal">

            <div class="admin-modal-header">
                <h3 id="modalUserName">User Details</h3>
                <button class="modal-close-btn" onclick="closeUserModal()">
                    <i class="uil uil-multiply"></i>
                </button>
            </div>

            <div class="admin-modal-body" id="userModalBody">
                <!-- Populated by JS -->
            </div>

            <!-- Edit balance section -->
            <div class="admin-modal-section">
                <h4>Adjust Balance</h4>
                <div class="admin-balance-row">
                    <div class="admin-balance-field">
                        <label>Balance ($)</label>
                        <input type="number" id="editBalance" class="admin-input" placeholder="0.00" min="0">
                    </div>
                    <div class="admin-balance-field">
                        <label>Profit ($)</label>
                        <input type="number" id="editProfit" class="admin-input" placeholder="0.00" min="0">
                    </div>
                    <div class="admin-balance-field">
                        <label>Pending ($)</label>
                        <input type="number" id="editPending" class="admin-input" placeholder="0.00" min="0">
                    </div>
                </div>
                <p class="admin-modal-error" id="balanceError"></p>
                <p class="admin-modal-success" id="balanceSuccess"></p>
                <button class="admin-btn-primary" onclick="saveBalance()">Save Balance</button>
            </div>

            <!-- KYC action -->
            <div class="admin-modal-section" id="kycActionSection">
                <h4>KYC Action</h4>
                <p class="admin-modal-note" id="kycCurrentStatus"></p>
                <div class="admin-action-btns">
                    <button class="admin-approve-btn" onclick="modalApproveKyc()">
                        <i class="uil uil-shield-check"></i> Verify KYC
                    </button>
                    <button class="admin-reject-btn" onclick="modalRejectKyc()">
                        <i class="uil uil-shield-slash"></i> Reject KYC
                    </button>
                </div>
                <p class="admin-modal-success" id="kycActionSuccess"></p>
            </div>

            <div class="admin-modal-footer">
                <button class="admin-btn-outline" onclick="closeUserModal()">Close</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase.js"></script>
    <script src="../../auth.js"></script>
    <script src="../../main.js"></script>
    <script src="../admin.js"></script>
    <script src="./users.js"></script>
</body>
</html>
