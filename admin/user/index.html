<!DOCTYPE html>
<html lang="en">

<head>
    <!-- THIS GOES FIRST -->
    <script>
        (function () {
            var saved = localStorage.getItem('currrentTheme');
            var isDark = saved === 'dark-theme'
                || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark-theme');
                document.body.classList.add('dark-theme');
            }
        })();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../admin.css">
    <style>
        /* Anti-FOUC: applied instantly before external CSS loads */
        html { background: #f0eff5; }
        html.dark-theme { background: #0d242c; }
        @media (min-width: 1024px) {
            body { display: grid; grid-template-columns: 17rem auto; }
        }
    </style>
</head>

<body>

    <!--==================== NAVBAR ====================-->
    <nav>
        <div class="container nav_container">
            <button class="nav_menu-btn nav_menu-btn--mobile"><i class="uil uil-bars"></i></button>
            <a href="../" class="nav_logo">
                <img src="../../assets/logo.png" alt="Logo">
            </a>
            <div class="nav_search">
                <i class="uil uil-search"></i>
                <input type="search" id="adminSearch" placeholder="Search users, transactions…">
            </div>
            <div class="nav_profile-wrapper">
                <div class="nav_bell-wrap" id="navBellWrap">
                    <button class="nav_bell-btn" id="navBellBtn" onclick="toggleNotifDropdown(event)" aria-label="Notifications">
                        <i class="uil uil-bell"></i>
                        <span class="nav_bell-badge" id="navBellBadge" style="display:none;">0</span>
                    </button>
                    <div class="notif-dropdown" id="notifDropdown">
                        <div class="notif-dropdown-header">
                            <span>Notifications</span>
                            <button class="notif-mark-read" onclick="markAllRead()">Mark all read</button>
                        </div>
                        <div class="notif-dropdown-list" id="notifDropdownList">
                            <div class="notif-loading"><i class="uil uil-spinner-alt spin"></i></div>
                        </div>
                        <a class="notif-see-all" href="../../admin/notifications/">See all notifications</a>
                    </div>
                </div>
                <div class="nav_profile">
                    <div class="nav_profile-photo">
                        <img src="../../assets/profile-1.jpg" alt="Admin">
                    </div>
                    <h5 id="navName">Admin</h5>
                    <span class="admin-badge">Admin</span>
                </div>
                <button class="nav_menu-btn nav_menu-btn--desktop"><i class="uil uil-bars"></i></button>
            </div>
        </div>
    </nav>

    <!--==================== SIDEBAR ====================-->
    <menu class="sidebar">
        <a href="../">
            <i class="uil uil-create-dashboard"></i>
            <h5>Overview</h5>
        </a>
        <a href="./" class="active">
            <i class="uil uil-users-alt"></i>
            <h5>Users</h5>
        </a>
        <a href="../deposit/">
            <i class="uil uil-arrow-circle-down"></i>
            <h5>Deposits</h5>
        </a>
        <a href="../withdrawals/">
            <i class="uil uil-arrow-circle-up"></i>
            <h5>Withdrawals</h5>
        </a>
        <a href="../investments/">
            <i class="uil uil-diamond"></i>
            <h5>Investments</h5>
        </a>
        <a href="../kyc/">
            <i class="uil uil-shield-check"></i>
            <h5>KYC</h5>
        </a>
        <a href="../settings/">
            <i class="uil uil-setting"></i>
            <h5>Settings</h5>
        </a>
        <a href="../chat/">
            <i class="uil uil-comments-alt"></i>
            <h5>Messages</h5>
        </a>
        <div class="sidebar-divider"></div>
        <a href="../../dashboard/" class="sidebar-user-link">
            <i class="uil uil-exit"></i>
            <h5>User View</h5>
        </a>
        <button class="sidebar_close-btn"><i class="uil uil-multiply"></i></button>
        <button class="sidebar_logout-btn" onclick="logout()">
            <i class="uil uil-sign-out-alt"></i><h5>Logout</h5>
        </button>
    </menu>

    <!--==================== MAIN ====================-->
    <main class="admin-main">

        <header class="admin-header">
            <div>
                <h1>Users</h1>
                <p class="admin-subtitle">Total: <strong id="userCountLabel">—</strong></p>
            </div>
            <div class="admin-header-actions">
                <button class="um-select-all-btn" id="selectAllBtn" onclick="toggleSelectAll()">
                    <i class="uil uil-check-square"></i> Select All
                </button>
            </div>
        </header>

        <!-- Filter tabs, search & sort — one row -->
        <div class="um-toolbar-row">
            <div class="admin-filter-tabs">
                <button class="admin-filter-tab active" data-filter="all" onclick="setFilter('all', this)">All</button>
                <button class="admin-filter-tab" data-filter="verified" onclick="setFilter('verified', this)">Verified</button>
                <button class="admin-filter-tab" data-filter="unsubmitted" onclick="setFilter('unsubmitted', this)">Unverified</button>
                <button class="admin-filter-tab" data-filter="pending" onclick="setFilter('pending', this)">KYC Pending</button>
            </div>

            <div class="um-search-sort-group">
                <div class="search-wrap um-search-compact">
                    <i class="uil uil-search"></i>
                    <input type="search" id="userSearch" placeholder="Name or email…" oninput="filterUsers()">
                </div>

                <div class="um-sort-dropdown" id="userSortDropdown">
                    <button class="um-sort-btn" id="userSortBtn" onclick="toggleSortDropdown(event)">
                        <span id="userSortLabel">Newest sign up</span>
                        <i class="uil uil-angle-down um-sort-chevron" id="userSortChevron"></i>
                    </button>
                    <div class="um-sort-menu" id="userSortMenu">
                        <button class="um-sort-option active" data-sort="newest" onclick="setSort('newest', this)">Newest sign up</button>
                        <button class="um-sort-option" data-sort="oldest" onclick="setSort('oldest', this)">Oldest sign up</button>
                        <button class="um-sort-option" data-sort="az" onclick="setSort('az', this)">Name A–Z</button>
                        <button class="um-sort-option" data-sort="za" onclick="setSort('za', this)">Name Z–A</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Email broadcast toolbar -->
        <div class="um-email-toolbar" id="emailToolbar">
            <div class="um-toolbar-left">
                <i class="uil uil-envelope-alt"></i>
                <span id="selectedCountLabel">0 selected</span>
                <button class="um-clear-btn" onclick="clearSelection()">Clear</button>
            </div>
            <button class="um-compose-btn" onclick="openComposeModal()">
                Compose Email
            </button>
        </div>

        <!-- Loading -->
        <div class="admin-loading" id="usersLoading">
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
        </div>

        <!-- Empty -->
        <div class="admin-empty" id="usersEmpty" style="display:none;">
            <i class="uil uil-users-alt"></i>
            <p>No users found.</p>
        </div>

        <!-- User cards grid -->
        <div class="um-grid" id="usersGrid" style="display:none;"></div>

    </main>

    <!-- ==================== USER DETAIL MODAL ==================== -->
    <div class="admin-modal-overlay" id="userModalOverlay" onclick="closeUserModal(event)">
        <div class="admin-modal">

            <div class="admin-modal-header">
                <h3 id="modalUserName">User Details</h3>
                <button class="modal-close-btn" onclick="closeUserModal()">
                    <i class="uil uil-multiply"></i>
                </button>
            </div>

            <div id="userModalBody"></div>

            <!-- Active investments (read-only) -->
            <div class="um-modal-section">
                <h4>Active Investments</h4>
                <div class="um-inv-loading" id="userInvLoading">
                    <i class="uil uil-spinner-alt spin"></i> Loading…
                </div>
                <p class="um-note" id="userInvEmpty" style="display:none;">No active investments.</p>
                <div class="um-inv-list" id="userInvList" style="display:none;"></div>
            </div>

            <!-- Edit balance -->
            <div class="um-modal-section">
                <h4>Adjust Balance</h4>
                <div class="um-balance-row">
                    <div class="um-balance-field">
                        <label>Balance ($)</label>
                        <input type="number" id="editBalance" class="um-input" placeholder="0.00" min="0">
                    </div>
                    <div class="um-balance-field">
                        <label>Profit ($)</label>
                        <input type="number" id="editProfit" class="um-input" placeholder="0.00" min="0">
                    </div>
                    <div class="um-balance-field">
                        <label>Pending ($)</label>
                        <input type="number" id="editPending" class="um-input" placeholder="0.00" min="0">
                    </div>
                </div>
                <p class="um-error" id="balanceError"></p>
                <p class="um-success" id="balanceSuccess"></p>
                <button class="um-btn-primary" onclick="saveBalance()">Save Balance</button>
            </div>

            <!-- KYC action -->
            <div class="um-modal-section" id="kycActionSection">
                <h4>KYC Action</h4>
                <p class="um-note" id="kycCurrentStatus"></p>
                <div class="um-action-btns">
                    <button class="action-btn approve" onclick="modalApproveKyc()">
                        <i class="uil uil-shield-check"></i> Verify
                    </button>
                    <button class="action-btn reject" onclick="modalRejectKyc()">
                        <i class="uil uil-shield-slash"></i> Reject
                    </button>
                </div>
                <p class="um-success" id="kycActionSuccess"></p>
            </div>

            <div class="um-modal-footer">
                <button class="um-btn-outline" onclick="closeUserModal()">Close</button>
            </div>

        </div>
    </div>

    <!-- ==================== COMPOSE EMAIL MODAL ==================== -->
    <div class="admin-modal-overlay" id="emailModalOverlay" onclick="handleEmailOverlayClick(event)">
        <div class="admin-modal">

            <div class="admin-modal-header">
                <h3><i class="uil uil-envelope-alt"></i> Send Email</h3>
                <button class="modal-close-btn" onclick="closeComposeModal()">
                    <i class="uil uil-multiply"></i>
                </button>
            </div>

            <div class="um-modal-section">
                <label class="um-label">Recipients (<span id="recipientCount">0</span>)</label>
                <div class="um-recipients-box" id="recipientList">—</div>
            </div>

            <div class="um-modal-section">
                <label class="um-label" for="emailSubject">Subject</label>
                <input type="text" id="emailSubject" class="um-input" placeholder="e.g. Important update from SyncProfitPath" maxlength="150">
            </div>

            <div class="um-modal-section">
                <label class="um-label" for="emailBody">Message</label>
                <textarea id="emailBody" class="um-textarea" placeholder="Write your message here…" maxlength="3000" oninput="updateCharCount()"></textarea>
                <div class="um-char-count"><span id="charCount">0</span> / 3000</div>
            </div>

            <div class="um-modal-section">
                <label class="um-label">Images <span class="um-note">(optional, up to 4)</span></label>
                <div class="um-image-previews" id="emailImagePreviews"></div>
                <label class="um-image-add-btn" id="emailImageAddBtn" for="emailImageInput">
                    <i class="uil uil-image-plus"></i> Add image
                </label>
                <input type="file" id="emailImageInput" accept="image/*" multiple hidden onchange="handleEmailImageSelect(event)">
            </div>

            <p class="um-feedback" id="emailFeedback"></p>

            <div class="um-modal-footer">
                <button class="um-btn-outline" onclick="closeComposeModal()">Cancel</button>
                <button class="um-btn-primary" id="emailSendBtn" onclick="sendBroadcastEmails()">
                    <i class="uil uil-message"></i> Send
                </button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase.js"></script>
    <script src="../../auth.js"></script>
    <script src="../../main.js"></script>
    <script src="../admin.js"></script>
    <script src="./users.js"></script>
    <script src="../../notify-inapp.js"></script>
</body>
</html>
