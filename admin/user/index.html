<!DOCTYPE html>
<html lang="en">

<head>
    <!-- THIS GOES FIRST -->
    <script>
        (function () {
            const theme = localStorage.getItem('currrentTheme');
            if (theme) document.documentElement.classList.add(theme);
        })();
    </script>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../admin.css">
</head>

<body>

    <!--==================== NAVBAR ====================-->
    <nav>
        <div class="container nav_container">
            <a href="../" class="nav_logo">
                <img src="../../assets/logo.png" alt="Logo">
            </a>
            <div class="nav_search">
                <i class="uil uil-search"></i>
                <input type="search" id="userSearch" placeholder="Search by name, email, country…" oninput="filterUsers()">
            </div>
            <div class="nav_profile-wrapper">
                <button class="nav_theme-btn"><i class="uil uil-moon"></i></button>
                <div class="nav_profile">
                    <div class="nav_profile-photo">
                        <img src="../../assets/profile-1.jpg" alt="Admin">
                    </div>
                    <h5 id="navName">Admin</h5>
                    <span class="admin-badge">Admin</span>
                </div>
                <button class="nav_menu-btn"><i class="uil uil-bars"></i></button>
            </div>
        </div>
    </nav>

    <!--==================== SIDEBAR ====================-->
    <menu class="sidebar">
        <a href="../">
            <i class="uil uil-create-dashboard"></i>
            <h5>Overview</h5>
        </a>
        <a href="./" class="active">
            <i class="uil uil-users-alt"></i>
            <h5>Users</h5>
        </a>
        <a href="../deposit/">
            <i class="uil uil-arrow-circle-down"></i>
            <h5>Deposits</h5>
        </a>
        <a href="../withdrawals/">
            <i class="uil uil-arrow-circle-up"></i>
            <h5>Withdrawals</h5>
        </a>
        <a href="../investments/">
            <i class="uil uil-diamond"></i>
            <h5>Investments</h5>
        </a>
        <a href="../kyc/">
            <i class="uil uil-shield-check"></i>
            <h5>KYC</h5>
        </a>
        <a href="../settings/">
            <i class="uil uil-setting"></i>
            <h5>Settings</h5>
        </a>
        <a href="../chat/">
            <i class="uil uil-comments-alt"></i>
            <h5>Messages</h5>
        </a>
        <div class="sidebar-divider"></div>
        <a href="../../dashboard/" class="sidebar-user-link">
            <i class="uil uil-exit"></i>
            <h5>User View</h5>
        </a>
        <button class="sidebar_close-btn"><i class="uil uil-multiply"></i></button>
        <button class="sidebar_logout-btn" onclick="logout()">
            <i class="uil uil-sign-out-alt"></i><h5>Logout</h5>
        </button>
    </menu>

    <!--==================== MAIN ====================-->
    <main class="admin-main">

        <header class="admin-header">
            <div>
                <h1>User Management</h1>
                <p class="admin-subtitle">Manage all registered users</p>
            </div>
            <div class="admin-header-actions">
                <span class="admin-count-label">Total: <strong id="userCountLabel">—</strong></span>
                <button class="select-all-btn" onclick="toggleSelectAll()">
                    <i class="uil uil-check-square"></i> Select All
                </button>
            </div>
        </header>

        <!-- Filter tabs -->
        <div class="admin-filter-tabs">
            <button class="admin-filter-tab active" data-filter="all" onclick="setFilter('all', this)">All Users</button>
            <button class="admin-filter-tab" data-filter="verified" onclick="setFilter('verified', this)">Verified</button>
            <button class="admin-filter-tab" data-filter="unsubmitted" onclick="setFilter('unsubmitted', this)">Unverified</button>
            <button class="admin-filter-tab" data-filter="pending" onclick="setFilter('pending', this)">KYC Pending</button>
        </div>

        <!-- Email broadcast toolbar (shown when users are selected) -->
        <div class="email-toolbar" id="emailToolbar">
            <div class="email-toolbar-left">
                <span class="email-selected-count" id="selectedCountLabel">0 selected</span>
                <button class="email-toolbar-clear" onclick="clearSelection()">Clear selection</button>
            </div>
            <button class="email-compose-btn" onclick="openComposeModal()">
                <i class="uil uil-envelope-alt"></i> Compose Email
            </button>
        </div>

        <!-- Loading -->
        <div class="admin-loading" id="usersLoading">
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
            <div class="admin-skeleton"></div>
        </div>

        <!-- Empty -->
        <div class="admin-empty" id="usersEmpty" style="display:none;">
            <i class="uil uil-users-alt"></i>
            <p>No users found.</p>
        </div>

        <!-- Table -->
        <div class="admin-table-wrapper" id="usersTableWrapper" style="display:none;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th class="col-check">
                            <input type="checkbox" class="user-checkbox" id="selectAllCheckbox" onchange="handleSelectAllCheckbox(this)">
                        </th>
                        <th>User</th>
                        <th>Email</th>
                        <th>Country</th>
                        <th>Balance</th>
                        <th>KYC</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>

    </main>

    <!-- ==================== USER DETAIL MODAL ==================== -->
    <div class="admin-modal-overlay" id="userModalOverlay" onclick="closeUserModal(event)">
        <div class="admin-modal">

            <div class="admin-modal-header">
                <h3 id="modalUserName">User Details</h3>
                <button class="modal-close-btn" onclick="closeUserModal()">
                    <i class="uil uil-multiply"></i>
                </button>
            </div>

            <div class="admin-modal-body" id="userModalBody">
                <!-- Populated by JS -->
            </div>

            <!-- Edit balance section -->
            <div class="admin-modal-section">
                <h4>Adjust Balance</h4>
                <div class="admin-balance-row">
                    <div class="admin-balance-field">
                        <label>Balance ($)</label>
                        <input type="number" id="editBalance" class="admin-input" placeholder="0.00" min="0">
                    </div>
                    <div class="admin-balance-field">
                        <label>Profit ($)</label>
                        <input type="number" id="editProfit" class="admin-input" placeholder="0.00" min="0">
                    </div>
                    <div class="admin-balance-field">
                        <label>Pending ($)</label>
                        <input type="number" id="editPending" class="admin-input" placeholder="0.00" min="0">
                    </div>
                </div>
                <p class="admin-modal-error" id="balanceError"></p>
                <p class="admin-modal-success" id="balanceSuccess"></p>
                <button class="admin-btn-primary" onclick="saveBalance()">Save Balance</button>
            </div>

            <!-- KYC action -->
            <div class="admin-modal-section" id="kycActionSection">
                <h4>KYC Action</h4>
                <p class="admin-modal-note" id="kycCurrentStatus"></p>
                <div class="admin-action-btns">
                    <button class="admin-approve-btn" onclick="modalApproveKyc()">
                        <i class="uil uil-shield-check"></i> Verify KYC
                    </button>
                    <button class="admin-reject-btn" onclick="modalRejectKyc()">
                        <i class="uil uil-shield-slash"></i> Reject KYC
                    </button>
                </div>
                <p class="admin-modal-success" id="kycActionSuccess"></p>
            </div>

            <div class="admin-modal-footer">
                <button class="admin-btn-outline" onclick="closeUserModal()">Close</button>
            </div>

        </div>
    </div>

    <!-- ==================== COMPOSE EMAIL MODAL ==================== -->
    <div class="email-modal-overlay" id="emailModalOverlay" onclick="handleEmailOverlayClick(event)">
        <div class="email-modal">

            <div class="email-modal-header">
                <h3><i class="uil uil-envelope-alt"></i> Send Email</h3>
                <button class="modal-close-btn" onclick="closeComposeModal()">
                    <i class="uil uil-multiply"></i>
                </button>
            </div>

            <div class="email-field">
                <label>Recipients (<span id="recipientCount">0</span>)</label>
                <div class="email-recipients-box" id="recipientList">—</div>
            </div>

            <div class="email-field">
                <label for="emailSubject">Subject</label>
                <input type="text" id="emailSubject" placeholder="e.g. Important update from SyncProfitPath" maxlength="150">
            </div>

            <div class="email-field">
                <label for="emailBody">Message</label>
                <textarea id="emailBody" placeholder="Write your message here…" maxlength="3000" oninput="updateCharCount()"></textarea>
                <div class="email-char-count"><span id="charCount">0</span> / 3000</div>
            </div>

            <div class="email-feedback" id="emailFeedback"></div>

            <div class="email-modal-footer">
                <button class="email-cancel-btn" onclick="closeComposeModal()">Cancel</button>
                <button class="email-send-btn" id="emailSendBtn" onclick="sendBroadcastEmails()">
                    <i class="uil uil-message"></i> Send
                </button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase.js"></script>
    <script src="../../auth.js"></script>
    <script src="../../main.js"></script>
    <script src="../admin.js"></script>
    <script src="./users.js"></script>
</body>
</html>
