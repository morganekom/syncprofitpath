<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            const theme = localStorage.getItem('currrentTheme');
            if (theme) document.documentElement.classList.add(theme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirming Account — SyncProfitPath</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./signup.css">
</head>

<body>
    <div class="auth-page" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
        <div class="signup-box" style="max-width:48rem;width:100%;margin:2rem;">
            <div class="signup-success" id="confirmState">
                <div class="success-ring">
                    <i class="uil uil-spinner spin"></i>
                </div>
                <h2>Verifying your account…</h2>
                <p style="color:var(--color-gray-light);font-size:1.2rem;">Please wait a moment.</p>
            </div>
        </div>
    </div>

    <style>
        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="./confirm.js"></script>
</body>
</html>
