<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            const theme = localStorage.getItem('currrentTheme');
            if (theme) document.documentElement.classList.add(theme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing In</title>
    <link rel="icon" type="image/png" href="../../assets/favicon.png">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../signup/signup.css">

    <style>
        .cb-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--color-light);
        }
        .cb-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.4rem;
        }
        .cb-title {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-dark);
        }
        .cb-sub {
            margin: 0;
            font-size: 1.2rem;
            color: var(--color-gray-dark);
        }

        @media (prefers-color-scheme: dark) {
            :root:not(.dark-theme):not(.light-theme) .cb-page  { background: #0d242c; }
            :root:not(.dark-theme):not(.light-theme) .cb-title { color: #ddd; }
            :root:not(.dark-theme):not(.light-theme) .cb-sub   { color: #adacb5; }
        }

        @keyframes checkPop {
            0%   { opacity: 0; transform: scale(0.4); }
            65%  { opacity: 1; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .check-reveal {
            animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeUp 0.35s ease forwards; }

        /* Dots slow-settle animation */
        .dot-settle {
            transition: cx 0.5s cubic-bezier(0.34,1.2,0.64,1),
                        cy 0.5s cubic-bezier(0.34,1.2,0.64,1),
                        opacity 0.4s ease;
        }
    </style>
</head>

<body>
    <div class="cb-page">
        <div class="cb-wrap">

            <svg id="animSvg" viewBox="0 0 200 200" width="160" height="160">

                <!-- 6 orbit dots -->
                <circle class="dot" cx="100" cy="22"  r="16" fill="#098654"/>
                <circle class="dot" cx="168" cy="62"  r="16" fill="#00e27b"/>
                <circle class="dot" cx="168" cy="138" r="16" fill="#00e27b"/>
                <circle class="dot" cx="100" cy="178" r="16" fill="#00e27b"/>
                <circle class="dot" cx="32"  cy="138" r="16" fill="#098654"/>
                <circle class="dot" cx="32"  cy="62"  r="16" fill="#098654"/>

                <!-- Checkmark: nested SVG with correct viewBox -->
                <svg id="checkmark"
                     x="15" y="28" width="170" height="144"
                     viewBox="0 0 1080 739"
                     style="opacity:0; transform-box:fill-box; transform-origin:center;">
                    <path fill="#00e27b" d="m1080 285.59l-391.82 370.73c-119.74 113.31-308.19 108.1-421.49-11.65l-163.56-172.86c22.68 9.41 45.73 13.95 68.64 14.58 6.34 0.18 12.69 0.11 19.29-0.44 5.37-0.34 10.51-0.69 15.9-1.51 7.35-1.02 14.7-2.28 22.06-4.03 3.93-0.87 7.86-1.73 11.8-3.09 1.96-0.43 4.18-1.1 6.4-1.77q3.31-1.01 6.64-2.01c4.18-1.35 8.12-2.71 12.07-4.31 6.16-2.26 12.32-4.53 18.26-7.3 5.92-2.52 11.85-5.28 17.55-8.29 5.93-2.77 11.62-5.78 17.32-9.04 5.7-3.01 11.4-6.27 16.86-9.78 10.92-6.78 21.61-13.8 31.81-21.08 5.22-3.51 10.21-7.28 15.19-11.04 19.43-14.59 37.17-29.72 52.2-43.7 3.01-2.84 5.76-5.45 8.52-8.06 8.27-7.82 15.53-14.93 22.06-21.59l1.76-1.9 0.76-0.95 26.08-25.38 103.29-100.59 2.76-2.61 209.42-197.92z"/>
                    <path fill="#098654" d="m506.91 288.94l-26.51 26.88-0.77 1.01-1.79 2.01-22.43 22.86-8.66 8.55c-15.29 14.82-33.37 30.88-53.22 46.43-5.09 4.01-10.18 8.02-15.52 11.78-10.43 7.77-21.37 15.28-32.55 22.54-5.6 3.76-11.44 7.26-17.28 10.51-5.85 3.5-11.69 6.74-17.79 9.74-5.84 3.24-11.93 6.24-18.02 8.98-6.1 2.99-12.45 5.48-18.79 7.96-4.06 1.74-8.12 3.23-12.43 4.72q-3.43 1.11-6.85 2.23c-2.28 0.74-4.57 1.48-6.59 1.98-4.06 1.48-8.12 2.46-12.18 3.45-7.6 1.97-15.2 3.43-22.8 4.65-5.58 0.96-10.89 1.43-16.46 1.9-6.84 0.71-13.42 0.92-20 0.87-23.78-0.17-47.79-4.39-71.52-13.67l-104.75-106.27 296.64-292.42z"/>
                </svg>

            </svg>

            <div style="display:flex;flex-direction:column;align-items:center;gap:0.6rem;">
                <h2 id="signingText"    class="cb-title">Signing you in…</h2>
                <p  id="signingSubtext" class="cb-sub">Setting up your account.</p>
            </div>

        </div>
    </div>

    <script>
    (function () {
        const dots      = Array.from(document.querySelectorAll('.dot'));
        const cx = 100, cy = 100, r = 78, total = dots.length;
        const opacities = [1, 0.82, 0.6, 0.4, 0.24, 0.12];

        // Final resting positions for each dot (evenly spaced around the circle)
        // Index matches original dot order: top, top-right, bottom-right, bottom, bottom-left, top-left
        const restAngles = [0, 60, 120, 180, 240, 300]; // degrees, 0 = top

        let angle = 0, raf, done = false;

        function toRad(d) { return d * Math.PI / 180; }

        function step() {
            if (done) return;
            angle = (angle + 1.4) % 360;
            dots.forEach((dot, i) => {
                const a = toRad(angle - i * (360 / total));
                dot.setAttribute('cx', (cx + r * Math.sin(a)).toFixed(2));
                dot.setAttribute('cy', (cy - r * Math.cos(a)).toFixed(2));
                dot.style.opacity = opacities[i];
            });
            raf = requestAnimationFrame(step);
        }
        step();

        window.signInComplete = function () {
            done = true;
            cancelAnimationFrame(raf);

            // Snap dots back to evenly-spaced rest positions, all fully visible
            dots.forEach((dot, i) => {
                dot.classList.add('dot-settle');
                const a = toRad(restAngles[i]);
                dot.setAttribute('cx', (cx + r * Math.sin(a)).toFixed(2));
                dot.setAttribute('cy', (cy - r * Math.cos(a)).toFixed(2));
                dot.style.opacity = '1';
                // Restore original alternating colors
                dot.style.fill = i % 2 === 0 ? '#098654' : '#00e27b';
            });

            // Pop checkmark in after dots settle
            setTimeout(() => {
                const mark = document.getElementById('checkmark');
                mark.style.opacity = '1';
                mark.classList.add('check-reveal');
            }, 400);

            // Swap text
            setTimeout(() => {
                const h2 = document.getElementById('signingText');
                const p  = document.getElementById('signingSubtext');
                h2.style.opacity = '0';
                p.style.opacity  = '0';
                setTimeout(() => {
                    h2.textContent = 'Signed in!';
                    p.textContent  = 'Redirecting you now…';
                    h2.style.opacity = '';
                    p.style.opacity  = '';
                    h2.classList.add('fade-in');
                    p.classList.add('fade-in');
                }, 200);
            }, 450);
        };
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase.js"></script>
    <script src="./callback.js"></script>
</body>
</html>
